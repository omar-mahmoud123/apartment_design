<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font:14px system-ui,-apple-system,sans-serif}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<title>New Cairo Walkthrough</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600&family=Figtree:wght@400;500;600&display=swap">
<style>
/* Layout: full-bleed 3D stage; small floating panels hug the corners like instruments on a site tablet */
:root {
  --bg: #e9edf1;
  --panel: rgba(255, 255, 255, 0.86);
  --panel-solid: #ffffff;
  --fg: #1c2733;
  --muted: #5b6876;
  --line: rgba(28, 39, 51, 0.14);
  --accent: #1f3b57;
  --accent-fg: #ffffff;
  --knob: rgba(31, 59, 87, 0.85);
  --font-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --font-ui: "Figtree", "Segoe UI", system-ui, -apple-system, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #11161c; --panel: rgba(22, 29, 37, 0.86); --panel-solid: #18202a; --fg: #e8eef4; --muted: #9aa8b6;
    --line: rgba(232, 238, 244, 0.16); --accent: #9cc4e8; --accent-fg: #0f1a25; --knob: rgba(156, 196, 232, 0.9);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #11161c; --panel: rgba(22, 29, 37, 0.86); --panel-solid: #18202a; --fg: #e8eef4; --muted: #9aa8b6;
  --line: rgba(232, 238, 244, 0.16); --accent: #9cc4e8; --accent-fg: #0f1a25; --knob: rgba(156, 196, 232, 0.9);
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--font-ui); overflow: hidden;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent;
}
#stage { position: fixed; inset: 0; touch-action: none; }
#stage canvas { display: block; width: 100%; height: 100%; outline: none; cursor: grab; }
#stage canvas:active { cursor: grabbing; }
.panel {
  background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
  -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
  box-shadow: 0 6px 24px rgba(10, 20, 30, 0.12);
}
#top {
  position: fixed; z-index: 5;
  top: calc(env(safe-area-inset-top, 0px) + 12px);
  left: max(12px, env(safe-area-inset-left, 0px)); right: max(12px, env(safe-area-inset-right, 0px));
  display: flex; flex-wrap: wrap; gap: 8px; align-items: center; pointer-events: none;
}
#top > * { pointer-events: auto; }
#brand { padding: 8px 12px; display: flex; flex-direction: column; gap: 1px; margin-right: auto; }
#brand h1 { font-family: var(--font-display); font-weight: 600; font-size: 17px; line-height: 1.1; margin: 0; letter-spacing: -0.01em; }
#brand span { font-size: 11.5px; color: var(--muted); letter-spacing: 0.02em; }
.seg { display: flex; padding: 3px; gap: 2px; }
.seg button {
  font: 600 13px/1 var(--font-ui); color: var(--fg); background: transparent; border: 0; border-radius: 9px;
  padding: 9px 12px; cursor: pointer; min-height: 36px;
}
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); }
.seg button:focus-visible, select:focus-visible, .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
#goto-wrap { display: flex; align-items: center; gap: 6px; padding: 3px 4px 3px 10px; }
#goto-wrap label { font-size: 12px; color: var(--muted); }
select {
  font: 500 13px var(--font-ui); color: var(--fg); background: transparent; border: 0; padding: 8px 6px;
  min-height: 36px; max-width: 46vw; cursor: pointer;
}
select option { background: var(--panel-solid); color: var(--fg); }
#where {
  position: fixed; z-index: 4; left: 50%; transform: translateX(-50%);
  bottom: calc(env(safe-area-inset-bottom, 0px) + 16px);
  padding: 7px 14px; font: 600 13px var(--font-ui); white-space: nowrap; pointer-events: none;
}
#where small { font-weight: 500; color: var(--muted); margin-left: 6px; }
#map-wrap {
  position: fixed; z-index: 4; right: max(12px, env(safe-area-inset-right, 0px));
  bottom: calc(env(safe-area-inset-bottom, 0px) + 12px); padding: 6px; display: flex; flex-direction: column; gap: 6px; align-items: flex-end;
}
#map { display: block; width: 104px; height: auto; border-radius: 8px; cursor: crosshair; touch-action: none; }
#map-wrap.closed #map { display: none; }
.btn {
  font: 600 12px var(--font-ui); color: var(--fg); background: transparent; border: 1px solid var(--line);
  border-radius: 8px; padding: 6px 10px; cursor: pointer; min-height: 30px;
}
#joy {
  position: fixed; z-index: 4; width: 124px; height: 124px; border-radius: 50%;
  left: max(18px, env(safe-area-inset-left, 0px)); bottom: calc(env(safe-area-inset-bottom, 0px) + 56px);
  background: var(--panel); border: 1px solid var(--line); touch-action: none;
}
#joy::after { content: "Walk"; position: absolute; left: 0; right: 0; bottom: -20px; text-align: center; font-size: 11px; color: var(--muted); }
#knob { position: absolute; left: 50%; top: 50%; width: 52px; height: 52px; margin: -26px 0 0 -26px; border-radius: 50%; background: var(--knob); }
#hint {
  position: fixed; z-index: 6; left: 50%; transform: translateX(-50%);
  bottom: calc(env(safe-area-inset-bottom, 0px) + 64px); width: min(420px, calc(100vw - 32px));
  padding: 16px 16px 14px; display: flex; flex-direction: column; gap: 10px;
}
#hint h2 { margin: 0; font: 600 16px/1.2 var(--font-display); text-wrap: balance; }
#hint ul { margin: 0; padding-left: 18px; display: grid; gap: 4px; font-size: 13.5px; line-height: 1.4; color: var(--fg); }
#hint .row { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
#hint .note { font-size: 12px; color: var(--muted); }
#hint .go { background: var(--accent); color: var(--accent-fg); border-color: transparent; padding: 9px 14px; }
#loading {
  position: fixed; inset: 0; z-index: 9; display: grid; place-items: center; background: var(--bg);
  font: 600 15px var(--font-ui); color: var(--muted);
}
#err { max-width: 360px; text-align: center; line-height: 1.5; }
@media (max-width: 560px) {
  #brand span { display: none; }
  #brand h1 { font-size: 15px; }
  #goto-wrap label { display: none; }
  #map { width: 84px; }
  #where { bottom: calc(env(safe-area-inset-bottom, 0px) + 12px); font-size: 12px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div id="stage" aria-label="3D view of the furnished apartment"></div>
<div id="loading" role="status"><div id="err">Building the flat…</div></div>

<div id="top">
  <div id="brand" class="panel"><h1>New Cairo flat</h1><span>3D walkthrough · real sizes · 3.25 m ceilings</span></div>
  <div class="seg panel" role="group" aria-label="View mode">
    <button id="m-walk" aria-pressed="true">Walk</button>
    <button id="m-doll" aria-pressed="false">Dollhouse</button>
  </div>
  <div id="goto-wrap" class="panel"><label for="goto">Go to</label><select id="goto"></select></div>
</div>

<div id="where" class="panel" aria-live="polite">Entrance</div>

<div id="map-wrap" class="panel">
  <canvas id="map" width="208" height="433" aria-label="Floor plan map. Tap a spot to jump there."></canvas>
  <button id="map-toggle" class="btn" aria-expanded="true">Hide map</button>
</div>

<div id="joy" hidden aria-hidden="true"><div id="knob"></div></div>

<div id="hint" class="panel" hidden>
  <h2>You're standing inside the front door</h2>
  <ul id="hint-list"></ul>
  <div class="row"><span class="note">Eye height 1.6 m. Walls and furniture block you, like in real life.</span><button id="hint-ok" class="btn go">Start</button></div>
</div>

  const panel = new T3.Mesh(new T3.PlaneGeometry(6, 3), new T3.MeshBasicMaterial({ color: 0xffffff }));
  panel.position.set(0, 4, -8); panel.lookAt(0, 0, 0); envScene.add(panel);
  scene.environment = pm.fromScene(envScene, 0.03).texture;
  pm.dispose();
}
// ------------------------------------------------------------------ lights
scene.add(new T3.HemisphereLight(0xf4f7fb, 0xbfb2a0, 0.42));
scene.add(new T3.AmbientLight(0xffffff, 0.0));
const sun = new T3.DirectionalLight(0xfff3e2, 0.95);
sun.position.set(5, 22, 9); sun.target.position.set(0, 0, 0); scene.add(sun.target);
sun.castShadow = true;
const sm = renderer.capabilities.maxTextureSize >= 4096 && !coarse ? 4096 : 2048;
sun.shadow.mapSize.set(sm, sm);
Object.assign(sun.shadow.camera, { left: -9, right: 9, top: 15, bottom: -15, near: 1, far: 50 });
sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.02;
scene.add(sun);

// room labels (dollhouse)
const labelSprites = [];
for (const L of SCENE.labels) {
  const c = document.createElement('canvas'), g = c.getContext('2d'), fs = 44;
  g.font = `600 ${fs}px Figtree, system-ui, sans-serif`;
  const tw = g.measureText(L.name).width + 48; c.width = Math.ceil(tw); c.height = 72;
  g.font = `600 ${fs}px Figtree, system-ui, sans-serif`;
  g.fillStyle = 'rgba(31,59,87,0.92)'; const r = 30;
  g.beginPath(); g.moveTo(r, 6); g.arcTo(c.width - 6, 6, c.width - 6, 66, r); g.arcTo(c.width - 6, 66, 6, 66, r); g.arcTo(6, 66, 6, 6, r); g.arcTo(6, 6, c.width - 6, 6, r); g.fill();
  g.fillStyle = '#fff'; g.textBaseline = 'middle'; g.fillText(L.name, 24, 38);
  const tex = new T3.CanvasTexture(c); tex.encoding = T3.sRGBEncoding;
  const sp = new T3.Sprite(new T3.SpriteMaterial({ map: tex, depthTest: false, transparent: true }));
  const hgt = 0.62; sp.scale.set(hgt * c.width / c.height, hgt, 1);
  sp.position.set(L.x, 2.1, L.z); sp.renderOrder = 10; sp.visible = false; scene.add(sp); labelSprites.push(sp);
}

// ------------------------------------------------------------------ collision
const segs = [];
function addPoly(p, closed) { for (let i = 0; i < p.length - (closed ? 0 : 1); i++) { const a = p[i], b = p[(i + 1) % p.length]; segs.push([a[0], a[1], b[0], b[1]]); } }
SCENE.walls.forEach(p => addPoly(p, true));
SCENE.windows.forEach(w => { if (w.kind !== 'int' || true) { const [x0, z0, x1, z1] = w.box; addPoly([[x0, z0], [x1, z0], [x1, z1], [x0, z1]], true); } });
SCENE.foot.forEach(p => addPoly(p, true));
SCENE.showers.forEach(s => s.glass.forEach(g => segs.push(g)));
SCENE.doors.forEach(d => segs.push([d.h[0], d.h[1], d.h[0] + d.o[0] * d.r, d.h[1] + d.o[1] * d.r]));
const R = 0.2;

}

}
function inside(x, z) { // point in apartment outline
  const p = SCENE.outline; let c = false;

function zoneAt(x, z) {

  const ch = Z.data[j][i]; return ch === '.' ? 0 : ch.charCodeAt(0) - 64;

// ------------------------------------------------------------------ state & controls
const EYE = 1.6;
const player = { x: 0, z: 0, yaw: 0, pitch: -0.05 };
let mode = 'walk';
const orbit = { tx: 0, tz: 1.6, ty: 0, r: 24, az: 0.1, pol: 0.6 };
let anim = null;
function setView(v, instant) {
  const to = { x: v.x, z: v.z, yaw: v.yaw, pitch: -0.08 };
  if (instant || reduceMotion) { Object.assign(player, to); return; }
  let dyaw = to.yaw - player.yaw; dyaw = Math.atan2(Math.sin(dyaw), Math.cos(dyaw));
  anim = { from: Object.assign({}, player), to: Object.assign({}, to, { yaw: player.yaw + dyaw }), t: 0, dur: 0.7, kind: 'walk' };
}
function setOrbitTarget(x, z, r) {
  const to = { tx: x, tz: z, r: r };
  if (reduceMotion) { Object.assign(orbit, to); return; }
  anim = { from: { tx: orbit.tx, tz: orbit.tz, r: orbit.r }, to, t: 0, dur: 0.7, kind: 'orbit' };
}

const keys = {};
window.addEventListener('keydown', e => {
  if (e.target.tagName === 'SELECT') return;
  keys[e.code] = true;
  if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space'].includes(e.code)) e.preventDefault();
});
window.addEventListener('keyup', e => { keys[e.code] = false; });
window.addEventListener('blur', () => { for (const k in keys) keys[k] = false; });

// pointer: look (walk) / orbit (dollhouse)
const canvas = renderer.domElement;
const pts = new Map();
let pinch0 = null;
canvas.addEventListener('pointerdown', e => {
  canvas.setPointerCapture(e.pointerId); pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pts.size === 2) { const [a, b] = [...pts.values()]; pinch0 = { d: Math.hypot(a.x - b.x, a.y - b.y), r: orbit.r, mx: (a.x + b.x) / 2, my: (a.y + b.y) / 2 }; }
  dismissHint();
});
canvas.addEventListener('pointermove', e => {
  const p = pts.get(e.pointerId); if (!p) return;
  const dx = e.clientX - p.x, dy = e.clientY - p.y; p.x = e.clientX; p.y = e.clientY;
  if (mode === 'walk') {
    const k = e.pointerType === 'touch' ? 0.0055 : 0.0038;
    player.yaw -= dx * k; player.pitch = Math.max(-1.3, Math.min(1.3, player.pitch - dy * k)); anim = null;
  } else if (pts.size === 1) {
    orbit.az -= dx * 0.006; orbit.pol = Math.max(0.12, Math.min(1.45, orbit.pol - dy * 0.005));
  } else if (pts.size === 2 && pinch0) {
    const [a, b] = [...pts.values()];
    const d = Math.hypot(a.x - b.x, a.y - b.y); orbit.r = Math.max(4, Math.min(45, pinch0.r * pinch0.d / Math.max(d, 1)));
    const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2; pan(mx - pinch0.mx, my - pinch0.my); pinch0.mx = mx; pinch0.my = my;
  }
});
function endPtr(e) { pts.delete(e.pointerId); if (pts.size < 2) pinch0 = null; }
canvas.addEventListener('pointerup', endPtr); canvas.addEventListener('pointercancel', endPtr);
canvas.addEventListener('wheel', e => { if (mode !== 'doll') return; e.preventDefault(); orbit.r = Math.max(4, Math.min(45, orbit.r * Math.exp(e.deltaY * 0.0012))); }, { passive: false });
canvas.addEventListener('contextmenu', e => e.preventDefault());
function pan(dx, dy) {
  const s = orbit.r * 0.0016, ca = Math.cos(orbit.az), sa = Math.sin(orbit.az);
  orbit.tx += (-dx * ca - dy * sa) * s; orbit.tz += (dx * sa - dy * ca) * s;
  orbit.tx = Math.max(-7, Math.min(7, orbit.tx)); orbit.tz = Math.max(-14, Math.min(14, orbit.tz));
}

// joystick
const joy = document.getElementById('joy'), knob = document.getElementById('knob');
const stick = { x: 0, y: 0, id: null };
if (coarse) joy.hidden = false;
joy.addEventListener('pointerdown', e => { stick.id = e.pointerId; joy.setPointerCapture(e.pointerId); moveStick(e); dismissHint(); });
joy.addEventListener('pointermove', e => { if (e.pointerId === stick.id) moveStick(e); });
function endStick(e) { if (e.pointerId !== stick.id) return; stick.id = null; stick.x = stick.y = 0; knob.style.transform = ''; }
joy.addEventListener('pointerup', endStick); joy.addEventListener('pointercancel', endStick);
function moveStick(e) {
  const r = joy.getBoundingClientRect(), cx = r.left + r.width / 2, cy = r.top + r.height / 2, max = r.width / 2 - 20;
  let dx = e.clientX - cx, dy = e.clientY - cy; const l = Math.hypot(dx, dy); if (l > max) { dx *= max / l; dy *= max / l; }
  stick.x = dx / max; stick.y = dy / max; knob.style.transform = `translate(${dx}px, ${dy}px)`;
}

// ------------------------------------------------------------------ UI wiring
const sel = document.getElementById('goto');
SCENE.views.forEach((v, i) => { const o = document.createElement('option'); o.value = i; o.textContent = v.name; sel.appendChild(o); });
sel.addEventListener('change', () => {
  const v = SCENE.views[+sel.value];
  if (mode === 'walk') setView(v); else setOrbitTarget(v.x, v.z, 9);
  canvas.focus({ preventScroll: true });
});
const bWalk = document.getElementById('m-walk'), bDoll = document.getElementById('m-doll');
function setMode(m) {
  mode = m;
  bWalk.setAttribute('aria-pressed', m === 'walk'); bDoll.setAttribute('aria-pressed', m === 'doll');
  const doll = m === 'doll';
  ceiling.visible = !doll; caps.forEach(c => c.visible = doll); labelSprites.forEach(s => s.visible = doll);
  const planes = doll ? [new T3.Plane(new T3.Vector3(0, -1, 0), CUT)] : [];
  CLIPPED.forEach(k => { M[k].clippingPlanes = planes; M[k].needsUpdate = true; });
  joy.hidden = doll || !coarse;
  mapWrap.hidden = doll; whereEl.hidden = doll;
  if (doll) { orbit.tx = player.x * 0.3; orbit.tz = player.z * 0.3; }
  anim = null;
}
bWalk.addEventListener('click', () => setMode('walk'));
bDoll.addEventListener('click', () => setMode('doll'));

const whereEl = document.getElementById('where');
let lastZone = -1;
function updateWhere() {
  const z = zoneAt(player.x, player.z);
  if (z === lastZone) return; lastZone = z;
  const L = SCENE.labels.find(l => l.n === z);
  whereEl.textContent = L ? L.name : 'Doorway';
}

// minimap
const mapWrap = document.getElementById('map-wrap'), mapC = document.getElementById('map'), mg = mapC.getContext('2d');
const mapImg = new Image(); mapImg.src = MINIMAP_SRC;
const VB = { x0: 18, y0: 40, w: 1132, h: 2352 };
function toMap(x, z) { return [((x * PX + OX) - VB.x0) / VB.w * mapC.width, ((z * PX + OZ) - VB.y0) / VB.h * mapC.height]; }
function fromMap(u, v) { return [((u / mapC.width) * VB.w + VB.x0 - OX) / PX, ((v / mapC.height) * VB.h + VB.y0 - OZ) / PX]; }
function drawMap() {
  mg.clearRect(0, 0, mapC.width, mapC.height);
  if (mapImg.complete) mg.drawImage(mapImg, 0, 0, mapC.width, mapC.height);
  const [u, v] = toMap(player.x, player.z), fx = -Math.sin(player.yaw), fz = -Math.cos(player.yaw);
  const a = Math.atan2(fz, fx);
  mg.fillStyle = 'rgba(31,59,87,0.25)'; mg.beginPath(); mg.moveTo(u, v); mg.arc(u, v, 34, a - 0.6, a + 0.6); mg.closePath(); mg.fill();
  mg.fillStyle = '#1f3b57'; mg.strokeStyle = '#fff'; mg.lineWidth = 2.5; mg.beginPath(); mg.arc(u, v, 6.5, 0, 7); mg.fill(); mg.stroke();
}
mapC.addEventListener('pointerdown', e => {
  const r = mapC.getBoundingClientRect();
  const [x, z] = fromMap((e.clientX - r.left) / r.width * mapC.width, (e.clientY - r.top) / r.height * mapC.height);
  if (!inside(x, z)) return;
  const p = { x, z }; collide(p);
  setView({ x: p.x, z: p.z, yaw: player.yaw });
  dismissHint();
});
const mapToggle = document.getElementById('map-toggle');
mapToggle.addEventListener('click', () => {
  const closed = mapWrap.classList.toggle('closed');
  mapToggle.textContent = closed ? 'Show map' : 'Hide map'; mapToggle.setAttribute('aria-expanded', !closed);
});

// hint
const hint = document.getElementById('hint'), hintList = document.getElementById('hint-list');
const lines = coarse
  ? ['Drag anywhere on the screen to look around.', 'Push the round stick to walk.', 'Tap the map or use “Go to” to jump to any room.', 'Dollhouse shows the whole flat from above.']
  : ['Drag with the mouse to look around.', 'Walk with W A S D or the arrow keys. Hold Shift to walk faster.', 'Click the map or use “Go to” to jump to any room.', 'Dollhouse shows the whole flat from above. Scroll to zoom.'];
lines.forEach(t => { const li = document.createElement('li'); li.textContent = t; hintList.appendChild(li); });
let seen = false; try { seen = localStorage.getItem('ncw-hint') === '1'; } catch (e) {}
if (!seen) hint.hidden = false;
function dismissHint() { if (hint.hidden) return; hint.hidden = true; try { localStorage.setItem('ncw-hint', '1'); } catch (e) {} }
document.getElementById('hint-ok').addEventListener('click', () => { dismissHint(); canvas.focus({ preventScroll: true }); });

// ------------------------------------------------------------------ loop
function resize() {
  const w = stage.clientWidth, h = stage.clientHeight;
  renderer.setSize(w, h, false); camera.aspect = w / h; camera.fov = camera.aspect < 0.8 ? 78 : 70; camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize); resize();
setView(SCENE.views[0], true);

let last = performance.now(), mapTick = 0;
function frame(now) {

  if (anim) {
    anim.t += dt / anim.dur; const k = anim.t >= 1 ? 1 : 1 - Math.pow(1 - anim.t, 3);
    const tgt = anim.kind === 'walk' ? player : orbit;
    for (const key in anim.to) tgt[key] = anim.from[key] + (anim.to[key] - anim.from[key]) * k;
    if (anim.t >= 1) anim = null;
  }
  if (mode === 'walk') {
    let f = 0, s = 0, turn = 0;
    if (keys.KeyW || keys.ArrowUp) f += 1; if (keys.KeyS || keys.ArrowDown) f -= 1;
    if (keys.KeyD) s += 1; if (keys.KeyA) s -= 1;
    if (keys.ArrowLeft || keys.KeyQ) turn += 1; if (keys.ArrowRight || keys.KeyE) turn -= 1;
    f -= stick.y; s += stick.x;
    player.yaw += turn * 1.8 * dt;
    const len = Math.hypot(f, s);
    if (len > 0.05) {
      anim = null;
      const sp = (keys.ShiftLeft || keys.ShiftRight ? 2.6 : 1.35) * Math.min(1, len) / len;
      const fx = -Math.sin(player.yaw), fz = -Math.cos(player.yaw), rx = Math.cos(player.yaw), rz = -Math.sin(player.yaw);
      const p = { x: player.x + (fx * f + rx * s) * sp * dt, z: player.z + (fz * f + rz * s) * sp * dt };
      collide(p); player.x = p.x; player.z = p.z;
    }
    camera.position.set(player.x, EYE, player.z); camera.rotation.set(player.pitch, player.yaw, 0);
    updateWhere();
    if ((mapTick++ & 1) === 0 && !mapWrap.classList.contains('closed')) drawMap();
  } else {
    const sp = Math.sin(orbit.pol);
    camera.position.set(orbit.tx + orbit.r * sp * Math.sin(orbit.az), orbit.ty + orbit.r * Math.cos(orbit.pol), orbit.tz + orbit.r * sp * Math.cos(orbit.az));
    camera.lookAt(orbit.tx, 0.6, orbit.tz);
  }
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
requestAnimationFrame(t => { last = t; frame(t); document.getElementById('loading').hidden = true; });
window.__walk = { player, orbit, setMode, setView, SCENE, renderer, blocked, collide, camera, scene };
})();
</script>
